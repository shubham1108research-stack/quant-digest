name: Watchlist Refresh

# Rebuilds docs/watchlist.json every quarter: re-resolves the seed + canon
# authors to OpenAlex ids, folds in anyone auto-promoted from our own archive
# last quarter, and refreshes each author's venue/volume/impact metrics. The
# daily digest just reads the committed file, so this heavy OpenAlex job only
# runs ~4x/year. Also runnable on demand via the Actions tab.

on:
  schedule:
    - cron: "0 6 1 1,4,7,10 *"    # 06:00 UTC on the 1st of Jan/Apr/Jul/Oct
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watchlist-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      # state.db lives in R2, not git: it is 53 MB of binary that cannot be
      # merged, so interleaved commits produced unresolvable rebases and one
      # run's work was silently discarded (twice). No-ops if R2 is unset, so
      # the committed copy still works until the bucket exists.
      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py pull

      - name: Rebuild watchlist roster
        env:
          CONTACT_EMAIL: ${{ secrets.GMAIL_ADDRESS }}   # OpenAlex polite pool
        run: python tools/gen_watchlist.py

      - name: Commit refreshed roster
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/watchlist.json || true
          git commit -m "watchlist refresh $(date -u +%F)" || echo "no changes"
          git pull --rebase --autostash origin master || true
          git push || (git pull --rebase --autostash origin master && git push)

      # always: a run killed at its timeout must still store what it wrote.
      # dbsync refuses to push anything that fails a health check, because an
      # object store keeps no history to roll back to.
      - name: Store state.db
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py push
