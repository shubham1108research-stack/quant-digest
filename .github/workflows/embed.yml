name: Semantic Index

# Builds docs/vec.bin -- the embedding index behind the portal's Ask tab (and,
# later, themes / similar-papers / the idea graph). Vectors are cached in
# state.db, so the first run embeds the whole archive and every run after that
# only pays for genuinely new papers.
#
# Embeddings come from Gemini (free tier, Matryoshka-truncated to 256 dims).
# If the daily free quota runs out mid-build the step still writes a PARTIAL
# index and exits clean -- re-run it the next day and it resumes from the cache.
#
# It also syncs the keys the /api/ask Function needs into the Pages project as
# encrypted secrets, so they are never exposed to the browser.

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Re-embed everything from scratch (ignores the cache)"
        type: boolean
        default: false

permissions:
  contents: read            # no git writes: state.db lives in R2

concurrency:
  # state.db is binary: concurrent writers rebase into an
  # unmergeable conflict and one run's work is discarded
  group: state-db
  cancel-in-progress: false

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # state.db lives in R2, not git: it is 53 MB of binary that cannot be
      # merged, so interleaved commits produced unresolvable rebases and one
      # run's work was silently discarded (twice). No-ops if R2 is unset, so
      # the committed copy still works until the bucket exists.
      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py pull

      - name: Build the embedding index
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/embed.py ${{ github.event.inputs.rebuild == 'true' && '--rebuild' || '' }}

      # the Function reads these from env; they never reach the browser
      - name: Sync API keys to the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # lets the Ask tab's "add to the archive" button dispatch
          # ingest-one.yml. Absent, the button reports it is not configured and
          # everything else in Ask carries on working.
          GH_TOKEN: ${{ secrets.INGEST_DISPATCH_TOKEN }}
          # Not keys: these two tell functions/api/_middleware.js which
          # Cloudflare team may sign an Access token and which applications
          # count. Both are public -- every visitor gets them in the login
          # redirect -- but they are still deployment config, and config that
          # lives only in a dashboard is config that vanishes the day the
          # project is recreated.
          #
          # INERT UNTIL YOU OPT IN. The loop skips anything unset, and neither
          # secret exists today, so this changes nothing until you run:
          #
          #   gh secret set ACCESS_TEAM_DOMAIN
          #   gh secret set ACCESS_AUD
          #
          # Do that ONLY if you want GitHub to be the source of truth. Once
          # set, every Semantic Index run overwrites whatever is on the Pages
          # project -- which is the point when recovering a lost project, and a
          # silent regression if the secret is stale and the dashboard is not.
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          # OPENAI_API_KEY MUST be in this list: Pages secrets are separate
          # from GitHub Secrets, so funding the OpenAI account does nothing
          # for the Ask tab until the key is synced to the Pages project.
          for k in OPENAI_API_KEY OPENROUTER_API_KEY MISTRAL_API_KEY GH_TOKEN \
                   ACCESS_TEAM_DOMAIN ACCESS_AUD; do
            [ -n "${!k}" ] || { echo "skipping $k (not set)"; continue; }
            printf '%s' "${!k}" | npx --yes wrangler@3 pages secret put "$k" --project-name=quant-digest
          done

      # Everything under docs/ that is gitignored -- the embedding index, the
      # paper graph, the map -- is rebuilt here. A Pages deploy is a full
      # snapshot, so deploying without this publishes a portal missing them,
      # and the browser does not fail loudly: fetch() on a 404 resolves.
      - name: Build docs/ artefacts
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/prepare_deploy.py

      - name: Deploy portal (docs/ + functions/)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy docs --project-name=quant-digest --branch=master --commit-dirty=true

      # always: a run killed at its timeout must still store what it wrote.
      # dbsync refuses to push anything that fails a health check, because an
      # object store keeps no history to roll back to.
      - name: Store state.db
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py push
