name: NBER Backfill (one-off)

# Manual-only: rebuilds docs/nber.json -- the NBER tab's Asset Pricing working
# papers by month, back to 2010, each enriched with OpenAlex citation counts
# (the potential-classics signal). Heavy OpenAlex use, so it runs here (fresh
# runner IP + polite pool) rather than locally where OpenAlex rate-limits.
# Re-run after a program/floor change; the daily digest keeps the current
# month fresh on its own.

on:
  # Manual-only now (the weekly self-heal was dropped to conserve free CI
  # minutes -- it's a heavy ~30-90 min OpenAlex pull). Trigger it yourself
  # occasionally to refresh NBER citation counts, or after a program/floor
  # change. Citations grow slowly, so monthly-ish by hand is plenty.
  workflow_dispatch:
    inputs:
      start:
        description: "Start month YYYY-MM (default = digest floor 2010-01)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # state.db is binary: concurrent writers rebase into an
  # unmergeable conflict and one run's work is discarded
  group: state-db
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # state.db lives in R2, not git: it is 53 MB of binary that cannot be
      # merged, so interleaved commits produced unresolvable rebases and one
      # run's work was silently discarded (twice). No-ops if R2 is unset, so
      # the committed copy still works until the bucket exists.
      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py pull

      - name: Backfill NBER Asset Pricing papers + citations
        env:
          CONTACT_EMAIL: ${{ secrets.GMAIL_ADDRESS }}   # OpenAlex polite pool
        run: python tools/backfill_nber.py ${{ github.event.inputs.start }}

      - name: Commit nber.json
        # always: this job runs 30-90 min against a 90-min ceiling, and a
        # success-gated commit throws the whole run away on a timeout. Every
        # other long job here learned that already.
        if: always()
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/nber.json || true
          git commit -m "NBER Asset Pricing backfill $(date -u +%F)" || echo "no changes"
          git pull --rebase --autostash origin master || true
          git push || (git pull --rebase --autostash origin master && git push)

      # A9: vec.bin and docs/abs/ are gitignored, so a checkout does not have
      # them. A Pages deploy is a full snapshot -- deploying docs/ without
      # rebuilding first publishes a manifest with no payload behind it, and
      # the browser's fetch of a 404 RESOLVES, so retrieval reads past the
      # buffer and scores NaN instead of failing loudly.
      # Everything under docs/ that is gitignored -- the embedding index, the
      # paper graph, the map -- is rebuilt here. A Pages deploy is a full
      # snapshot, so deploying without this publishes a portal missing them,
      # and the browser does not fail loudly: fetch() on a 404 resolves.
      - name: Build docs/ artefacts
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/prepare_deploy.py

      - name: Deploy portal to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy docs \
            --project-name=quant-digest --branch=master --commit-dirty=true

      # always: a run killed at its timeout must still store what it wrote.
      # dbsync refuses to push anything that fails a health check, because an
      # object store keeps no history to roll back to.
      - name: Store state.db
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py push
