name: NBER Backfill (one-off)

# Manual-only: rebuilds docs/nber.json -- the NBER tab's Asset Pricing working
# papers by month, back to 2010, each enriched with OpenAlex citation counts
# (the potential-classics signal). Heavy OpenAlex use, so it runs here (fresh
# runner IP + polite pool) rather than locally where OpenAlex rate-limits.
# Re-run after a program/floor change; the daily digest keeps the current
# month fresh on its own.

on:
  # Weekly self-heal: re-pulls citation counts (which grow over time, and which
  # a single throttled run can leave partial) from a clean runner IP, well
  # spaced from any manual runs so OpenAlex's polite pool isn't exhausted.
  schedule:
    - cron: "0 7 * * 0"          # Sundays 07:00 UTC
  workflow_dispatch:
    inputs:
      start:
        description: "Start month YYYY-MM (default = digest floor 2010-01)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nber-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Backfill NBER Asset Pricing papers + citations
        env:
          CONTACT_EMAIL: ${{ secrets.GMAIL_ADDRESS }}   # OpenAlex polite pool
        run: python tools/backfill_nber.py ${{ github.event.inputs.start }}

      - name: Commit nber.json
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/nber.json || true
          git commit -m "NBER Asset Pricing backfill $(date -u +%F)" || echo "no changes"
          git pull --rebase --autostash origin master || true
          git push || (git pull --rebase --autostash origin master && git push)

      - name: Deploy portal to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy docs \
            --project-name=quant-digest --branch=master --commit-dirty=true
