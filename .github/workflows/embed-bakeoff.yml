name: Embedding Bake-off

# A local Hugging Face model against the paid OpenAI embedder, on the same
# corpus and the same 30 golden questions, decided by a number.
#
# WHY IT IS WORTH ASKING. Not cost -- 25,633 papers is about nine cents through
# text-embedding-3-small. Embeddings are the paid dependency on the path that
# breaks FIRST: when the credits lapse, embed.py cannot rebuild the index and
# Ask's mode:"embed" fails outright, so retrieval stops rather than degrades. A
# local embedder makes search survive an expired card.
#
# WHAT IS HELD CONSTANT. Same corpus, same text, same int8 quantisation, same
# funnel. Only the model differs.
#
# THE GRAPH. Each model gets its OWN, built from its own vectors by
# `graph.py local`, identically on both sides and sim-edges only.
#
# The first version of this workflow disabled the graph instead, because
# docs/edges.bin is derived from the OpenAI vectors and letting one model's
# neighbours rescue the other model's misses measures a hybrid nobody would
# ship. That reasoning was right and the remedy was the weaker of the two: the
# graph is DOWNSTREAM of the embedding, so a good embedder should produce a
# good neighbourhood, and refusing to measure that hands the comparison a
# handicap it would never have in production. The portal always runs with the
# graph on, so the decision should be made with it on.
#
# There is deliberately NO graph-off control run. It would answer "is the graph
# pulling its weight", and that is not a live question -- the graph ships in
# every configuration under consideration, so the only comparison worth paying
# for is the one between two portals that both have it.
#
# Citation edges are deliberately absent: they come from the database, are
# identical for both models, and are therefore not what a bake-off compares.
#
# SIM_FLOOR is a tuned constant that does not transfer for free between models
# of different width. Watch the edges-per-paper line on both sides -- an
# order-of-magnitude gap means the floor is wrong for one of them, not that
# its neighbourhood is better.
#
# Writes nothing: no index is replaced, no state.db is pushed.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "sentence-transformers model"
        required: false
        default: "BAAI/bge-small-en-v1.5"
      limit:
        description: "Papers to embed (0 = the whole archive)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: embed-bakeoff
  cancel-in-progress: true

jobs:
  bakeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # CPU-only torch: the GPU build is several GB and there is no GPU here.
      - name: Install sentence-transformers (CPU)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install sentence-transformers

      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py pull

      # The control side needs the CURRENT index and archive.json, which are
      # gitignored and rebuilt per run.
      - name: Build the OpenAI index (the control)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python -c "import portal, store; con=store.connect(); print('archive.json ->', portal.build(con), 'items')"
          python tools/embed.py

      - name: Build the local index
        run: |
          python tools/embed_local.py --out docs_local \
            --model "${{ github.event.inputs.model }}" \
            --limit "${{ github.event.inputs.limit }}"

      # Same construction on both sides, each from its own vec.bin.
      - name: Build each model its own graph
        run: |
          python tools/graph.py local --docs docs
          python tools/graph.py local --docs docs_local

      - name: Measure — OpenAI, graph on (what ships)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python eval/run.py

      - name: Measure — local model, graph on (what would ship)
        run: python eval/run.py --docs docs_local


      - name: Keep the query-vector caches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bakeoff-qvec
          path: eval/qvec.json
          if-no-files-found: ignore
          retention-days: 14
