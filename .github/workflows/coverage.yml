name: Data Coverage Audit

# What the archive holds, per field, against the LIVE database.
#
# Every design decision in the graph work turns on coverage -- whether the
# citation graph is dense enough for PageRank, whether enough papers carry a
# publication year to make a cohort percentile meaningful, whether the labelled
# set is big enough to train on. Those numbers were repeatedly guessed from a
# stale local copy of state.db and repeatedly guessed wrong.
#
# Read-only. Pulls state.db, prints a table, pushes nothing.

on:
  workflow_dispatch:
  schedule:
    # Weekly, so coverage becomes a trend rather than a one-off measurement.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python tools/dbsync.py pull

      # docs/ft lives in R2 as well, and the parsed-full-text row is wrong
      # without it -- it would report zero rather than "not fetched".
      - name: Fetch the full-text corpus
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py ftpull

      - name: Audit
        run: python tools/coverage.py

      - name: Machine-readable copy
        run: python tools/coverage.py --json > coverage.json

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json
          retention-days: 90
