name: KV Setup (one-off)

# Manual-only, run once: creates the Workers KV namespace that backs the
# cross-device Saved-papers sync. Prints the namespace id in the logs --
# paste that into wrangler.toml's [[kv_namespaces]] id, then this workflow
# file can be deleted.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  create-kv:
    runs-on: ubuntu-latest
    steps:
      - name: Create SAVED_PAPERS KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 kv namespace create SAVED_PAPERS
