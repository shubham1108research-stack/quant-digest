name: Verify Latest Deployment Environment (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: List recent deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/quant-digest/deployments?per_page=5" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
          | python3 -c "
import json, sys
d = json.load(sys.stdin)
for dep in d['result']:
    print(dep['id'][:8], dep['environment'], dep['created_on'], dep['url'])
"
