name: Redo Backfill Months (one-off)

# Manual-only, run once: re-fetches and re-scores already-completed backfill
# months against the current scoring logic (real LLM calls -- needs the
# provider secrets), persists every scored candidate to the archive this
# time, and rewrites their docs/monthly.json entries. Delete this workflow
# file once it's served its purpose.

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Space-separated YYYY-MM list to redo"
        required: true
        default: "2026-03 2026-04 2026-05 2026-06"

concurrency:
  # state.db is binary: concurrent writers conflict
  group: state-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  redo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      # state.db lives in R2, not git: it is 53 MB of binary that cannot be
      # merged, so interleaved commits produced unresolvable rebases and one
      # run's work was silently discarded (twice). No-ops if R2 is unset, so
      # the committed copy still works until the bucket exists.
      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py pull

      - name: Redo months
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/redo_backfill_months.py ${{ github.event.inputs.months }}

      - name: Commit state + portal
        if: always()
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.db docs/ || true
          git commit -m "redo backfill months: ${{ github.event.inputs.months }}" || echo "nothing to commit"
          git pull --rebase --autostash origin master || true
          git push || (git pull --rebase --autostash origin master && git push)

      # A9: vec.bin and docs/abs/ are gitignored, so a checkout does not have
      # them. A Pages deploy is a full snapshot -- deploying docs/ without
      # rebuilding first publishes a manifest with no payload behind it, and
      # the browser's fetch of a 404 RESOLVES, so retrieval reads past the
      # buffer and scores NaN instead of failing loudly.
      # Everything under docs/ that is gitignored -- the embedding index, the
      # paper graph, the map -- is rebuilt here. A Pages deploy is a full
      # snapshot, so deploying without this publishes a portal missing them,
      # and the browser does not fail loudly: fetch() on a 404 resolves.
      - name: Build docs/ artefacts
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python tools/prepare_deploy.py

      - name: Deploy portal to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy docs \
            --project-name=quant-digest --branch=master --commit-dirty=true

      # always: a run killed at its timeout must still store what it wrote.
      # dbsync refuses to push anything that fails a health check, because an
      # object store keeps no history to roll back to.
      - name: Store state.db
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py push
