name: Archive Maintenance

# Retires papers that should never have been collected: junk titles, records
# with no text, future-dated metadata, and -- from sources that were selecting
# on nothing -- the off-topic and the finance-shaped-but-useless.
#
# FLAGGED, NOT DELETED. state.db is the cross-run dedup memory, so deleting a
# row invites the same paper back on the next collection. A retired row keeps
# its uid and gains `retired: "<why>"`; every consumer skips it -- the portal
# export, the embedding index, the graph, the map, the full-text queue -- so it
# stops costing a vector, a graph node and a slot in Ask's recall, without
# losing the memory that we already looked at it.
#
# Reversible per reason: `python tools/prune.py --restore adjacent_no_desk_fit`.
#
# Then tags what survives. Both are hygiene passes over state.db and they share
# the same lock, so running them together is right -- and in this order, because
# there is no point spending effort tagging rows that are about to be retired.
#
# Defaults to dry_run, because a run that retires more than expected should be
# read before it is committed to.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be retired and write nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: state-db
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py pull

      - name: Prune
        run: |
          python tools/prune.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # BEFORE tagging, not after: the matcher reads title + abstract, so a
      # row whose abstract arrives in this step gets tagged on this run rather
      # than the next one. 907 live rows have no abstract at all -- every one
      # of them embeds from weaker text than it needs to.
      - name: Backfill missing abstracts
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: python tools/fill_abstracts.py

      # Free and deterministic -- no model call -- so it re-runs over the whole
      # archive in seconds after any vocabulary edit.
      - name: Tag
        run: |
          python tools/test_tags.py
          python tools/tags.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Store state.db
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py push
