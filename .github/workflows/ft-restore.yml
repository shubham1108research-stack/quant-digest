name: Restore the passage corpus

# Promote ft.tar.gz.prev back to live, after a bad ftpush.
#
# WHY THIS EXISTS. A full-text run parsed into a docs/ft it had never restored
# and pushed the result, taking the corpus from 2,381 papers to 315. ftpush
# keeps one version back, so ft.tar.gz.prev still holds the good archive -- and
# `rollback` covered state.db only, so there was no command to bring it back.
#
# Deliberately manual, deliberately confirmed, and it prints what it is about
# to do BEFORE doing it. A restore that runs on a schedule or on a typo is
# another way to lose the same data.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESTORE to promote ft.tar.gz.prev over ft.tar.gz'
        required: true
        default: ""
      redeploy:
        description: "Rebuild and deploy after restoring"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: state-db
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Refuse unless confirmed
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RESTORE" ]; then
            echo "confirm was '${{ github.event.inputs.confirm }}', expected RESTORE"
            exit 1
          fi

      # What is live now, and what we would replace it with. Printed first so a
      # wrong .prev is visible before it overwrites anything.
      - name: Show both archives
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python tools/dbsync.py ftpull
          echo "LIVE ft.tar.gz currently unpacks to $(ls docs/ft 2>/dev/null | wc -l) papers"
          rm -rf docs/ft

      - name: Promote ft.tar.gz.prev
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py ftrollback

      - name: Verify what came back
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python tools/dbsync.py ftpull
          N=$(ls docs/ft 2>/dev/null | wc -l)
          echo "RESTORED corpus holds $N papers"
          # The loss took it to 315. Anything near that means .prev was already
          # the truncated archive and the restore has not helped.
          if [ "$N" -lt 1000 ]; then
            echo "still only $N papers -- ft.tar.gz.prev was not the good copy"
            exit 1
          fi

      # The deploy that shipped alongside the loss is serving 315 papers'
      # worth of full text. Rebuilding puts the restored corpus back on the
      # portal, and bm25.bin is derived from docs/ft so it must be rebuilt too.
      - name: Rebuild and deploy
        if: ${{ github.event.inputs.redeploy == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python tools/dbsync.py pull
          python tools/prepare_deploy.py --skip-map

      # Copied verbatim from deploy-portal.yml, branch included. `--branch` is
      # not cosmetic: master is the production deployment and anything else
      # publishes to a preview alias, so a restore that "worked" would leave
      # the live portal still serving the truncated corpus.
      - name: Deploy docs/ to Cloudflare Pages
        if: ${{ github.event.inputs.redeploy == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy docs \
            --project-name=quant-digest --branch=master --commit-dirty=true
