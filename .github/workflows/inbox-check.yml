name: Check Feed Mailbox

# Is the subscription mailbox reachable, and is the Gmail filter putting mail
# where the collector looks? Read-only, writes nothing, touches no state.
#
# It runs HERE rather than on a laptop so the app password stays a GitHub
# secret. The alternative -- exporting FEED_IMAP_PASS into a shell to run
# tools/inbox_check.py by hand -- puts a live credential in an environment and
# a history file, to answer a question that takes twenty seconds in CI.
#
# It is also much cheaper than the previous way of finding out, which was to
# run a whole digest and read "[inbox] 0 items" without learning whether that
# meant a bad password, a missing label, or simply nothing subscribed yet.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install: inbox_check.py uses imaplib and email from the standard
      # library on purpose, so this stays a diagnostic that cannot itself fail
      # for an unrelated reason.
      - name: Probe the mailbox
        env:
          FEED_IMAP_HOST: ${{ secrets.FEED_IMAP_HOST }}
          FEED_IMAP_USER: ${{ secrets.FEED_IMAP_USER }}
          FEED_IMAP_PASS: ${{ secrets.FEED_IMAP_PASS }}
          # Must match digest.yml, or this proves something about a mailbox the
          # collector never reads.
          FEED_IMAP_FOLDER: FEN,QuantDigest
        run: python tools/inbox_check.py

      - run: pip install -r requirements.txt

      # Fixture tests for the mail parser. They run BEFORE the live
      # probe because both of this parser's failures produced
      # well-formed output -- zero papers, then sixty papers titled
      # "_____ T A B L E" -- and a live run reports a count either way.
      - name: Test the SSRN parser against fixtures
        run: python tools/test_ssrn_parse.py

      # "The mailbox is reachable" and "the mail turns into papers" are
      # different claims, and only the second one matters. sources.inbox()
      # guards its only state write on `con is not None`, so calling it without
      # a connection parses the mail and writes nothing -- no dedup marks, no
      # rows, nothing for the real run to trip over afterwards.
      - name: Parse the mail into papers (read-only, no state written)
        env:
          FEED_IMAP_HOST: ${{ secrets.FEED_IMAP_HOST }}
          FEED_IMAP_USER: ${{ secrets.FEED_IMAP_USER }}
          FEED_IMAP_PASS: ${{ secrets.FEED_IMAP_PASS }}
          FEED_IMAP_FOLDER: FEN,QuantDigest
        run: |
          python - <<'EOF'
          import collections
          import sources
          items = sources.inbox(print)          # no con -> nothing persisted
          print("")
          print("papers extracted : %d" % len(items))
          by = collections.Counter(i.get("source", "?") for i in items)
          for k, n in by.most_common(10):
              print("   %-34s %d" % (k, n))
          withabs = sum(1 for i in items if (i.get("abstract") or "").strip())
          print("with an abstract : %d/%d" % (withabs, len(items)))
          unver = sum(1 for i in items if i.get("unverified"))
          if unver:
              print("unverified       : %d (link the source site would not confirm)" % unver)
          print("")
          for i in items[:8]:
              print("   %s" % (i.get("title") or "")[:76])
          EOF
