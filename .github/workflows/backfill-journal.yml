name: Backfill Journal Archive

# Collects a journal's back-catalogue from OpenAlex, by ISSN.
#
# Every configured journal is nearly empty and has one cause:
# sources._crossref_issn asks Crossref for the last 30 days only, so the
# collector has been working correctly and forgetting everything older.
# Measured across FAJ and the nine PM Research journals -- 389 held, 13,308
# published since 1985.
#
# OpenAlex rather than Crossref or RePEc because it is the only one of the
# three with the abstracts: Crossref carries none at all for Financial Analysts
# Journal (Taylor & Francis do not deposit them) and RePEc does not index
# practitioner journals. It is free, needs no key, and runs at roughly 2,300
# papers a minute.
#
# NOT SCORED. Rows arrive with no relevance_category on purpose -- collection
# is free and the rubric is not, so the two decisions stay separable. Run
# tools/rescore.py later, in stages, when that spend is worth deciding on.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "all-pmr, all, or a single ISSN like 0015-198X"
        required: false
        default: "all-pmr"
      since:
        description: "Earliest publication year"
        required: false
        default: "1985"
      allow_title_only:
        description: "Keep records with no abstract (dilutes retrieval)"
        type: boolean
        default: false
      dry_run:
        description: "Report what would be collected and write nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: state-db
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python tools/dbsync.py pull

      # CONTACT_EMAIL puts the requests in OpenAlex's polite pool. Not a key --
      # they have none -- but it is how they ask to be identified.
      - name: Collect
        env:
          CONTACT_EMAIL: ${{ secrets.GMAIL_ADDRESS }}
        run: |
          case "${{ github.event.inputs.target }}" in
            all-pmr) SEL="--all-pmr" ;;
            all)     SEL="--all" ;;
            *)       SEL="--issn ${{ github.event.inputs.target }}" ;;
          esac
          python tools/backfill_journal.py $SEL \
            --since "${{ github.event.inputs.since }}" \
            ${{ github.event.inputs.allow_title_only == 'true' && '--allow-title-only' || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Store state.db
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py push
