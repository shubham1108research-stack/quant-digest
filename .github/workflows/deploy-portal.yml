name: Deploy Portal

# Manual-only: pushes the committed docs/ to Cloudflare Pages without running a
# full digest. Handy after editing the portal or refreshing docs/classics.json.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy docs/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy docs \
            --project-name=quant-digest --branch=master --commit-dirty=true

      - name: TEMP -- verify deployment environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/quant-digest/deployments?per_page=5" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/deps.json
          python3 -c "import json; d=json.load(open('/tmp/deps.json')); [print(x['id'][:8], x['environment'], x['created_on'], '->', x['url'], '| aliases:', x.get('aliases')) for x in d['result']]"
