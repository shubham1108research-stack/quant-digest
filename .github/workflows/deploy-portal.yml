name: Deploy Portal

# Manual-only: pushes the committed docs/ to Cloudflare Pages without running a
# full digest. Handy after editing the portal or refreshing docs/classics.json.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # NOT the state-db group. GitHub keeps only ONE pending run per group, so
  # queueing this behind a six-hour rescore meant the next queued run cancelled
  # it -- which is exactly what happened to the three-pane portal deploy. And it
  # does not need the lock: the group exists to stop concurrent COMMITS of a
  # binary file, and this workflow has no commit step at all. embed.py writes
  # state.db on the runner, but that checkout is discarded, so nothing races.
  group: deploy-portal
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # state.db lives in R2, not git: it is 53 MB of binary that cannot be
      # merged, so interleaved commits produced unresolvable rebases and one
      # run's work was silently discarded (twice). No-ops if R2 is unset, so
      # the committed copy still works until the bucket exists.
      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py pull

      # vec.bin / abs/ are gitignored -- rebuild them from the state.db vector
      # cache (no API calls when nothing is new) so a standalone deploy still
      # ships a working Ask tab
      # The key is required, not optional: without it embed.py writes the index
      # from cache alone, so any paper whose vector was invalidated (e.g. by an
      # abstract backfill) silently vanishes from search while the deploy still
      # reports success.
      # Everything under docs/ that is gitignored -- the embedding index, the
      # paper graph, the map -- is rebuilt here. A Pages deploy is a full
      # snapshot, so deploying without this publishes a portal missing them,
      # and the browser does not fail loudly: fetch() on a 404 resolves.
      - name: Build docs/ artefacts
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/prepare_deploy.py

      - name: Deploy docs/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy docs \
            --project-name=quant-digest --branch=master --commit-dirty=true

      # always: a run killed at its timeout must still store what it wrote.
      # dbsync refuses to push anything that fails a health check, because an
      # object store keeps no history to roll back to.
      - name: Store state.db
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py push
