name: Full Text (GROBID)

# Builds the passage corpus behind Ask's deep reading: resolves each paper's
# open-access PDF, runs it through GROBID to get real document structure
# (section headings, paragraphs), splits it into citable passages, and writes
# one JSON file per paper into docs/ft/.
#
# Deliberately incremental -- pass a limit and run it repeatedly. Papers already
# parsed are skipped, and each file is written once and never rewritten, so the
# committed corpus grows by exactly what was added rather than churning.
#
# GROBID runs as a service container: it is a Java service, far too heavy to
# install on the runner directly, but trivial to attach as a container.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many papers to parse this run (highest-value first)"
        required: false
        default: "200"

permissions:
  contents: read            # no git writes: the corpus goes to R2 now

concurrency:
  # state.db is binary: concurrent writers rebase into an
  # unmergeable conflict and one run's work is discarded
  group: state-db
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      grobid:
        # CRF-only build (~500 MB). The default/full image bundles the deep
        # learning models at ~8 GB and never came up inside the runner's 7 GB
        # of RAM. CRF is enough for structure extraction, which is all we need.
        image: grobid/grobid:0.9.1-crf
        ports:
          - 8070:8070
        options: --init --ulimit core=0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # state.db lives in R2, not git: it is 53 MB of binary that cannot be
      # merged, so interleaved commits produced unresolvable rebases and one
      # run's work was silently discarded (twice). No-ops if R2 is unset, so
      # the committed copy still works until the bucket exists.
      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python tools/dbsync.py pull

      # RESTORE THE EXISTING CORPUS BEFORE PARSING INTO IT. This step was
      # missing, and its absence destroyed the archive: fulltext.py wrote its
      # 314 newly-parsed papers into an EMPTY docs/ft, and the ftpush below
      # then replaced R2's copy with only those. 2,381 papers became 315.
      #
      # ftpush's health check did not catch it, and could not: it requires an
      # index and >=200 members, and 315 papers satisfies both. A floor detects
      # a broken archive, never a shrunken one -- only comparing against what
      # was already there can do that.
      - name: Restore the existing passage corpus
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python tools/dbsync.py ftpull
          echo "docs/ft holds $(ls docs/ft 2>/dev/null | wc -l) papers before parsing"
          # PDFs downloaded where the host will serve us (nber.org refuses
          # this runner's IP and serves a residential one) ride in via R2.
          # download() short-circuits on any file already on disk.
          python tools/dbsync.py pdfpull

      # the container is up before the service is: GROBID loads its models for
      # the better part of a minute, so poll rather than assume
      - name: Wait for GROBID
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8070/api/isalive >/dev/null; then
              echo "GROBID alive after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          echo "GROBID never came up -- container state and logs follow:"
          docker ps --all --filter "ancestor=grobid/grobid:0.9.1-crf"             --format '{{.ID}} {{.Status}}' || true
          for c in $(docker ps -aq); do
            echo "--- logs $c ---"; docker logs --tail 60 "$c" 2>&1 || true
          done
          exit 1

      - name: Parse PDFs into passages
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CONTACT_EMAIL: ${{ secrets.GMAIL_ADDRESS }}
          GROBID_URL: http://localhost:8070
        run: python tools/fulltext.py --limit ${{ github.event.inputs.limit || 200 }}

      # always: a long run that times out must not discard its passages.
      # A previous job lost 103 papers to a commit gated on success.
      #
      # To R2, not to git. These are the full parsed text of published papers --
      # ~70,000 characters each, mostly from journal publishers -- and this
      # repository is PUBLIC, so committing them was publication rather than
      # personal use. They now live beside state.db in the private bucket, and
      # tools/prepare_deploy.py fetches them on every deploy.
      - name: Store the passage corpus
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py ftpush

      # Everything under docs/ that is gitignored -- the embedding index, the
      # paper graph, the map -- is rebuilt here. A Pages deploy is a full
      # snapshot, so deploying without this publishes a portal missing them,
      # and the browser does not fail loudly: fetch() on a 404 resolves.
      - name: Build docs/ artefacts
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/prepare_deploy.py

      - name: Deploy
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy docs --project-name=quant-digest --branch=master --commit-dirty=true

      # always: a run killed at its timeout must still store what it wrote.
      # dbsync refuses to push anything that fails a health check, because an
      # object store keeps no history to roll back to.
      - name: Store state.db
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py push
