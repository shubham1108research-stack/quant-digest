name: Build core list

# The core-paper candidate list, assembled against the LIVE archive.
#
# It has to run here rather than on a laptop for two reasons: the working copy
# of state.db is whatever that machine last pulled (half the archive, and zero
# paper_refs), and route C -- the citation snowball -- reads the 339,411
# reference rows tools/graph.py cites wrote to the live database.
#
# The harvested candidate sets are regenerated in-job because export/ is
# gitignored: it holds third-party content and this repository is public.
# SignalDoc is one request and QuantSeeker is a few minutes; Papers With
# Backtest is ~3,800 polite page fetches, so it is opt-in via `with_pwb` and
# the result is kept as an artifact to be downloaded rather than committed.
#
# READ-ONLY. Pulls state.db, never pushes, so unlike the writing workflows it
# does not take the state-db lock.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Papers to select; 0 = compile the whole cleaned pool"
        required: false
        default: "0"
      with_pwb:
        description: "Also harvest Papers With Backtest (~65 min)"
        type: boolean
        required: false
        default: false
      skip_sweep:
        description: "Reuse the recovered core_sweep.json instead of re-running route A (~20 min). Diagnostics only."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py pull

      - name: Reuse the previous harvest
        # RUNS BEFORE THE HARVESTS, AND INTO ITS OWN DIRECTORY. Both matter.
        # It used to run after them and unpack straight into export/, where
        # `gh run download` aborts the WHOLE archive the moment one member
        # already exists -- "error extracting core_signaldoc.csv: file exists"
        # -- so core_pwb.json never arrived and route F reported 0 of 3,745
        # papers in a job that exited green. Unpacking somewhere else and
        # copying only what we mean to reuse cannot collide with a fresh
        # harvest, and running first lets the sweep be skipped when its
        # 20-minute output was already recovered.
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          mkdir -p export _prev
          PREV=$(gh run list --workflow=build-core.yml --status=success \
                   --limit 5 --json databaseId --jq '.[].databaseId' | head -1)
          if [ -n "$PREV" ]; then
            gh run download "$PREV" -n core-list -D _prev/ || true
            for f in core_pwb.json core_sweep.json; do
              [ -f "_prev/$f" ] && cp "_prev/$f" "export/$f" \
                && echo "recovered $f from run $PREV"
            done
          fi
          ls -la export/ 2>/dev/null || true

      - name: Harvest the cheap sources
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: |
          python tools/core_tags.py
          python tools/core_sources.py signaldoc
          python tools/core_sources.py quantseeker

      - name: Run the tag sweep (route A)
        # 299 terms, up to 3 pages each; ~20 min with the key. The sweep IS
        # route A -- skipping it is how carry ended up with 1 paper of 2,000.
        # skip_sweep exists for diagnostic re-runs only, and refuses to skip
        # unless a recovered core_sweep.json is actually on disk: a silently
        # absent route A is the exact failure this workflow was written to
        # stop happening again.
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: |
          if [ "${{ inputs.skip_sweep }}" = "true" ] && [ -s export/core_sweep.json ]; then
            echo "sweep SKIPPED -- reusing recovered core_sweep.json ($(wc -c < export/core_sweep.json) bytes)"
          else
            python tools/core_sources.py sweep
          fi

      - name: Harvest Papers With Backtest
        if: ${{ inputs.with_pwb == true }}
        run: python tools/core_sources.py pwb

      - name: Recover the watched-author candidates
        # Written by s2_harvest authors, which keeps them only as an artifact.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 32970831654 -n s2-candidates -D export/ || \
            echo "watched-author artifact unavailable (expires ~2026-09-25)"

      - name: Build the list
        # OPENALEX_API_KEY IS NOT OPTIONAL HERE. Route C resolves the unheld
        # high-in-degree references -- papers many core papers cite that the
        # archive does not hold -- 50 per request through OpenAlex, and those
        # are the highest-centrality candidates the whole exercise produces.
        # Without the key the keyless $0.10/day budget is exhausted by other
        # callers and the stage returns almost nothing: measured locally, 47
        # resolved against the ~2,225 this recovers. The failure is silent --
        # route C simply reports a smaller number -- which is exactly how it
        # went unnoticed until the route contributions were tallied.
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python -c "import oa; oa.preflight()"
          python tools/build_core.py --target 0

      - name: Clean the strays, then select
        # The cleaner ran only on a laptop until now, so a CI build produced an
        # UNCLEANED list and quietly discarded 1,394 hand judgements. It reads
        # data/core_judgments.json (committed, unlike export/) so those verdicts
        # outrank the keyword gate here exactly as they do locally.
        run: |
          python tools/clean_core.py
          cp export/core_candidates.csv export/core_pool.csv
          python tools/build_core.py --from-pool export/core_pool.csv \
            --target "${{ inputs.target }}"

      - name: Route tally
        # The audit, in the job that produced the numbers. Part 7.6's bar is
        # "all seven routes non-zero"; route C is the one to read.
        run: |
          python - <<'PY'
          import csv, collections
          rows = list(csv.DictReader(open('export/core_candidates.csv',
                                          encoding='utf-8', newline='')))
          n = collections.Counter()
          for r in rows:
              for x in (r.get('found_by') or '').split('+'):
                  if x:
                      n[x] += 1
          print(f"rows: {len(rows):,}")
          for k, v in n.most_common():
              print(f"  {k:<12} {v:>8,}")
          seeded = [r for r in rows if int(float(r.get('seed_indegree') or 0)) > 0]
          print(f"seed_indegree>0: {len(seeded):,}")
          print("sleeves:", dict(collections.Counter(
              r.get('sleeve') for r in rows).most_common()))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: core-list
          path: |
            export/core_candidates.csv
            export/core_candidates.json
            export/core_pool.csv
            export/core_strays.csv
            export/core_review.md
            export/core_tags.csv
            export/core_sweep.json
            export/core_signaldoc.csv
            export/core_quantseeker.json
            export/core_pwb.json
