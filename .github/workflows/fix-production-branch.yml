name: Fix Pages Production Branch (one-off)

# Manual-only, run once: the Cloudflare Pages project's server-side
# "production branch" setting is very likely still "main" from whenever the
# project was first created (wrangler pages project create --production-
# branch=main), even after fixing the deploy command's --branch flag to
# "master" -- that setting lives on the project, not the CLI call, so it
# needs a direct API PATCH. Delete this workflow file once it's served its
# purpose.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Show current production_branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/quant-digest" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print('production_branch:', d['result']['production_branch'])"

      - name: Set production_branch to master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -X PATCH "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/quant-digest" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"production_branch":"master"}' | python3 -c "import json,sys; d=json.load(sys.stdin); print('success:', d.get('success')); print('production_branch now:', d.get('result',{}).get('production_branch'))"
