name: Research Digest

on:
  schedule:
    # Runs DAILY. Cadence is enforced in code, not by the cron: main.py skips
    # any run starting within DIGEST_MIN_INTERVAL_HOURS (20h) of the last one,
    # so it does not matter that the external cron (cron-job.org) or these two
    # backups fire more often -- only the first firing past the window does
    # real work and the rest exit in seconds. Two firings a day because a
    # scheduled run GitHub drops (they are best-effort under load) would
    # otherwise skip that day entirely. Trigger a run NOW anytime via
    # workflow_dispatch with force=true.
    - cron: "30 4 * * *"     # 04:30 UTC daily -- primary
    - cron: "30 9 * * *"     # 09:30 UTC daily -- backup if the first is dropped
  workflow_dispatch:
    inputs:
      force:
        description: "Run now, ignoring the 3-day interval guard"
        type: boolean
        default: false

# Only one digest run at a time: a delayed/batched cron tick queues behind the
# running one (never cancels it), then hits the once-per-day guard and exits --
# so overlapping fires can't double-run or race on state.db.
concurrency:
  # state.db is binary: concurrent writers rebase into an
  # unmergeable conflict and one run's work is discarded
  group: state-db
  cancel-in-progress: false

permissions:
  contents: read            # no git writes: state.db lives in R2

jobs:
  digest:
    runs-on: ubuntu-latest
    # Hard backstop: the code has its own time budgets (collection fail-fasts,
    # LLM triage/consensus cap at ~65min total), so a healthy run finishes in
    # well under an hour. This ceiling just ensures a pathological wedge fails in
    # ~2h instead of burning the full GitHub default of 6h.
    timeout-minutes: 120
    env:
      # dormant until you add the Cloudflare secrets (see README/Setup)
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      # state.db lives in R2, not git: it is 53 MB of binary that cannot be
      # merged, so interleaved commits produced unresolvable rebases and one
      # run's work was silently discarded (twice). No-ops if R2 is unset, so
      # the committed copy still works until the bucket exists.
      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py pull

      # Collect any artifact batch an earlier run opened. A no-op when
      # nothing is pending, so it costs a second on most days -- and it is what
      # makes submit/collect work at all: a 24h batch cannot be waited on
      # inside one run, but the digest comes round every morning.
      - name: Collect a pending artifact batch
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/artifacts.py --collect

      # A row with no abstract is embedded from its TITLE alone, which is a far
      # weaker vector than it looks and indistinguishable from a good one once
      # stored. tools/fill_abstracts.py existed but ran only when someone
      # remembered, so the gap accumulated silently. Bounded so the Crossref
      # leg -- one request per DOI, unlike the batched OpenAlex and S2 legs --
      # cannot stretch the daily run; the backlog drains a little each morning.
      # Non-fatal: a missing abstract is worth far less than a missed digest.
      - name: Backfill missing abstracts
        continue-on-error: true
        run: python tools/fill_abstracts.py --limit 300

      - name: Install Playwright Chromium (for AQR/Man/RA house research)
        run: python -m playwright install --with-deps chromium

      - name: Run digest
        env:
          # main.py enforces the ~3-day cadence: it skips unless >=
          # DIGEST_MIN_INTERVAL_HOURS since the last run, OR FORCE_RUN=true
          # (set from the workflow's `force` input for an on-demand run).
          FORCE_RUN: ${{ github.event.inputs.force }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
          # optional -- ranking is dormant if none are set. Triage uses the
          # first that responds (free-first); consensus on the shortlist uses
          # all together. OpenAI is paid (backstops triage; votes on shortlist).
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # subscription mailbox (sources.inbox): publishers who block
          # crawlers but will mail you the same content -- SSRN eJournals
          # above all, which have no usable RSS at all. Absent, the collector
          # logs and skips.
          #
          # FOLDER is a Gmail LABEL, not the inbox. Gmail exposes labels as
          # IMAP folders, so the pipeline can only ever read the publisher
          # alerts a filter has already sorted into FEN -- never anything else
          # in that account. That is a privilege reduction, not tidiness, and
          # it is worth keeping that way.
          FEED_IMAP_HOST: ${{ secrets.FEED_IMAP_HOST }}
          FEED_IMAP_USER: ${{ secrets.FEED_IMAP_USER }}
          FEED_IMAP_PASS: ${{ secrets.FEED_IMAP_PASS }}
          # Comma-separated. FEN is where the SSRN filter files the eJournal
          # alerts; QuantDigest is where the mailed-in Claude digest should be
          # labelled. One folder was not enough -- the digest arrives in INBOX,
          # so a collector pointed only at FEN could never see it, and the
          # parser would have sat there correct and never once invoked.
          FEED_IMAP_FOLDER: FEN,QuantDigest
          # Shared secret in the Claude digest's JSON payload. The mailbox
          # address is public, so without this anyone who learns it could write
          # into the archive. Unset, sources._parse_claude_digest refuses every
          # payload rather than trusting one -- which is the right default, but
          # it does mean the channel is dormant until this secret exists.
          DIGEST_TOKEN: ${{ secrets.DIGEST_TOKEN }}
        run: python main.py

      # Everything under docs/ that is gitignored -- the embedding index, the
      # paper graph, the map -- is rebuilt here. A Pages deploy is a full
      # snapshot, so deploying without this publishes a portal missing them,
      # and the browser does not fail loudly: fetch() on a 404 resolves.
      - name: Build docs/ artefacts
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/prepare_deploy.py

      - name: Deploy portal to Cloudflare Pages (private hosting)
        if: ${{ env.CF_TOKEN != '' }}   # dormant until Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create quant-digest \
            --production-branch=master 2>/dev/null || true
          npx --yes wrangler@3 pages deploy docs \
            --project-name=quant-digest --branch=master --commit-dirty=true

      # always: a run killed at its timeout must still store what it wrote.
      # dbsync refuses to push anything that fails a health check, because an
      # object store keeps no history to roll back to.
      - name: Store state.db
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py push
