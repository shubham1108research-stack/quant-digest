name: Research Digest

on:
  schedule:
    # PRIMARY trigger is an EXTERNAL cron (cron-job.org) that fires a
    # workflow_dispatch daily at 23:30 UTC / 05:00 IST -- precise and reliable,
    # unlike GitHub's own best-effort cron (which fired ~8h late on 2026-07-19).
    # GitHub's cron is kept ONLY as a conditional backup: two attempts spaced 5h
    # apart, a few hours AFTER the primary window. main.py's once-per-day guard
    # (store.kv "last_run_date", schedule events only) makes each a fast no-op
    # when the digest already ran that day -- so these do real work ONLY if the
    # external primary missed. The `concurrency` group below serialises any
    # overlap so a late/batched tick can't race the guard.
    - cron: "30 4 * * *"   # 04:30 UTC = 10:00 IST -- backup 1 (5h after primary)
    - cron: "30 9 * * *"   # 09:30 UTC = 15:00 IST -- backup 2 (another 5h later)
  workflow_dispatch: {}

# Only one digest run at a time: a delayed/batched cron tick queues behind the
# running one (never cancels it), then hits the once-per-day guard and exits --
# so overlapping fires can't double-run or race on state.db.
concurrency:
  group: research-digest
  cancel-in-progress: false

permissions:
  contents: write            # to commit state.db and reports/ back

jobs:
  digest:
    runs-on: self-hosted
    env:
      # dormant until you add the Cloudflare secrets (see README/Setup)
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install Playwright Chromium (for AQR/Man/RA house research)
        run: python -m playwright install --with-deps chromium

      - name: Run digest
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}  # lets main.py's once-per-day
          #   guard skip a same-day redundant "schedule" firing; manual runs (event
          #   "workflow_dispatch") always execute regardless of the guard.
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
          # optional -- ranking is dormant if none are set. Triage uses the
          # first that responds (free-first); consensus on the shortlist uses
          # all together. OpenAI is paid (backstops triage; votes on shortlist).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      - name: Commit state + report archive + portal
        if: always()
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.db reports/ docs/ || true
          git commit -m "digest run $(date -u +%F)" || echo "nothing to commit"
          # survive a moved remote (concurrent push) instead of failing red
          git pull --rebase --autostash origin master || true
          git push || (git pull --rebase --autostash origin master && git push)

      - name: Deploy portal to Cloudflare Pages (private hosting)
        if: ${{ env.CF_TOKEN != '' }}   # dormant until Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create quant-digest \
            --production-branch=master 2>/dev/null || true
          npx --yes wrangler@3 pages deploy docs \
            --project-name=quant-digest --branch=master --commit-dirty=true
