name: Research Digest

on:
  schedule:
    # Runs DAILY. Cadence is enforced in code, not by the cron: main.py skips
    # any run starting within DIGEST_MIN_INTERVAL_HOURS (20h) of the last one,
    # so it does not matter that the external cron (cron-job.org) or these two
    # backups fire more often -- only the first firing past the window does
    # real work and the rest exit in seconds. Two firings a day because a
    # scheduled run GitHub drops (they are best-effort under load) would
    # otherwise skip that day entirely. Trigger a run NOW anytime via
    # workflow_dispatch with force=true.
    - cron: "30 4 * * *"     # 04:30 UTC daily -- primary
    - cron: "30 9 * * *"     # 09:30 UTC daily -- backup if the first is dropped
  workflow_dispatch:
    inputs:
      force:
        description: "Run now, ignoring the 3-day interval guard"
        type: boolean
        default: false

# Only one digest run at a time: a delayed/batched cron tick queues behind the
# running one (never cancels it), then hits the once-per-day guard and exits --
# so overlapping fires can't double-run or race on state.db.
concurrency:
  # state.db is binary: concurrent writers rebase into an
  # unmergeable conflict and one run's work is discarded
  group: state-db
  cancel-in-progress: false

permissions:
  contents: write            # to commit state.db and reports/ back

jobs:
  digest:
    runs-on: ubuntu-latest
    # Hard backstop: the code has its own time budgets (collection fail-fasts,
    # LLM triage/consensus cap at ~65min total), so a healthy run finishes in
    # well under an hour. This ceiling just ensures a pathological wedge fails in
    # ~2h instead of burning the full GitHub default of 6h.
    timeout-minutes: 120
    env:
      # dormant until you add the Cloudflare secrets (see README/Setup)
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install Playwright Chromium (for AQR/Man/RA house research)
        run: python -m playwright install --with-deps chromium

      - name: Run digest
        env:
          # main.py enforces the ~3-day cadence: it skips unless >=
          # DIGEST_MIN_INTERVAL_HOURS since the last run, OR FORCE_RUN=true
          # (set from the workflow's `force` input for an on-demand run).
          FORCE_RUN: ${{ github.event.inputs.force }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
          # optional -- ranking is dormant if none are set. Triage uses the
          # first that responds (free-first); consensus on the shortlist uses
          # all together. OpenAI is paid (backstops triage; votes on shortlist).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      # keep the Ask tab's semantic index current: vectors are cached in
      # state.db, so this only embeds papers collected today (fractions of a
      # cent). Never fails the run -- a stale index still answers, just without
      # the newest papers.
      - name: Update semantic index
        if: always()
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python tools/embed.py

      - name: Commit state + report archive + portal
        if: always()
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.db reports/ docs/ || true
          git commit -m "digest run $(date -u +%F)" || echo "nothing to commit"
          # survive a moved remote (concurrent push) instead of failing red
          git pull --rebase --autostash origin master || true
          git push || (git pull --rebase --autostash origin master && git push)

      - name: Deploy portal to Cloudflare Pages (private hosting)
        if: ${{ env.CF_TOKEN != '' }}   # dormant until Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create quant-digest \
            --production-branch=master 2>/dev/null || true
          npx --yes wrangler@3 pages deploy docs \
            --project-name=quant-digest --branch=master --commit-dirty=true
