name: Research Digest

on:
  schedule:
    # GitHub's schedule trigger is best-effort: it can be delayed by hours or
    # dropped entirely (confirmed 2026-07-19: the 23:30 UTC tick fired ~8h late).
    # So we give it FIVE chances across the early-IST-morning window -- GitHub is
    # very likely to run at least one near the intended time. main.py's
    # once-per-day guard (store.kv "last_run_date", schedule events only) makes
    # every fire after the first a fast no-op, and the `concurrency` group below
    # serialises them so a late/batched tick can't race the guard.
    - cron: "30 23 * * *"  # 23:30 UTC = 05:00 IST  (primary)
    - cron: "50 23 * * *"  # 23:50 UTC = 05:20 IST
    - cron: "20 0 * * *"   # 00:20 UTC = 05:50 IST
    - cron: "10 1 * * *"   # 01:10 UTC = 06:40 IST
    - cron: "20 2 * * *"   # 02:20 UTC = 07:50 IST  (last-resort catch-up)
    #        (revert to a single "30 23 */3 * *" once backfill reaches 2010)
  workflow_dispatch: {}

# Only one digest run at a time: a delayed/batched cron tick queues behind the
# running one (never cancels it), then hits the once-per-day guard and exits --
# so overlapping fires can't double-run or race on state.db.
concurrency:
  group: research-digest
  cancel-in-progress: false

permissions:
  contents: write            # to commit state.db and reports/ back

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      # dormant until you add the Cloudflare secrets (see README/Setup)
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install Playwright Chromium (for AQR/Man/RA house research)
        run: python -m playwright install --with-deps chromium

      - name: Run digest
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}  # lets main.py's once-per-day
          #   guard skip a same-day redundant "schedule" firing; manual runs (event
          #   "workflow_dispatch") always execute regardless of the guard.
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
          # optional -- ranking is dormant if none are set. Triage uses the
          # first that responds (free-first); consensus on the shortlist uses
          # all together. OpenAI is paid (backstops triage; votes on shortlist).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      - name: Commit state + report archive + portal
        if: always()
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.db reports/ docs/ || true
          git commit -m "digest run $(date -u +%F)" || echo "nothing to commit"
          # survive a moved remote (concurrent push) instead of failing red
          git pull --rebase --autostash origin master || true
          git push || (git pull --rebase --autostash origin master && git push)

      - name: Deploy portal to Cloudflare Pages (private hosting)
        if: ${{ env.CF_TOKEN != '' }}   # dormant until Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create quant-digest \
            --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy docs \
            --project-name=quant-digest --branch=main --commit-dirty=true
