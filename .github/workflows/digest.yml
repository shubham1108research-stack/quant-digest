name: Weekly Research Digest

on:
  schedule:
    - cron: "30 2 * * WED"   # 02:30 UTC = 08:00 IST, Wednesdays
  workflow_dispatch: {}

permissions:
  contents: write            # to commit state.db and reports/ back

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install Playwright Chromium (for AQR/Man/RA house research)
        run: python -m playwright install --with-deps chromium

      - name: Run digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
          # optional -- ranking stays dormant if this secret is unset
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit state + report archive + portal
        if: always()
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.db reports/ docs/ || true
          git commit -m "digest run $(date -u +%F)" || echo "nothing to commit"
          git push
