name: S2 Drip Harvest

# The Semantic Scholar endpoints that POST /paper/batch cannot serve, taken a
# little at a time so the public quota is never the constraint.
#
# THE ARITHMETIC. The public limit is 100 requests per 5 minutes. That makes a
# per-paper endpoint impossible in one job and easy across a day:
#
#     100 requests / 5 min  =  28,800 requests / day
#     the archive           =  20,999 papers
#
# So a schedule beats a bigger job. Each run takes a bounded budget, does that
# much, records what it learned in state.db, and stops. Progress accumulates in
# the shared store rather than in a checkpoint file, so nothing is lost between
# runs and nothing needs remembering.
#
# NEGATIVE RESULTS ARE RECORDED TOO. A paper S2 has never heard of gets an
# `s2_miss` mark. Without it every future run would spend a request
# rediscovering the same dead row and the drip would never reach the live ones.
#
# WHY TWO ACTIONS
#   refs   GET /paper/{id}/references -- batch returns referenceCount but an
#          EMPTY references list, measured. Targets papers OpenAlex could not
#          supply references for, chiefly working papers.
#   match  GET /paper/search/match -- the only route for the 3,863 title-hash
#          rows that carry neither DOI nor arXiv id.
#
# BUDGET SIZING. The quota is a RATE, not a daily cap, and the pacing already
# honours it: one request every 3 seconds IS 100 per 5 minutes. So a longer run
# at the same spacing is exactly as compliant as a short one, and the only real
# ceiling is the job timeout.
#
#     100 requests  =  5 min   -> 75 runs to clear the queue -> ~10 days
#   2,400 requests  =  2 hours ->  4 runs                    ->  ~1 day
#
# THE API IS NOT WHAT BOUNDS THE CADENCE. At 9,600 requests a day this uses a
# third of the 28,800 ceiling. Three other things bind first:
#
#   state.db is 159 MB and is pulled AND pushed every run. Eight runs a day is
#   2.5 GB of R2 transfer; four runs at double the budget is 1.3 GB for
#   identical throughput.
#
#   every run holds the shared `state-db` concurrency group, which the digest
#   and the deploy also need. Fewer, longer runs collide less.
#
#   a GitHub job dies at 6 hours, which at 3s pacing is ~7,200 requests. That
#   is the true per-run ceiling, and 2,400 leaves room for the pull, the push
#   and any backoff.
#
# Measured on the first run: 100 requests, 0 throttled, 99 papers, 1,810
# references stored.

on:
  schedule:
    # Offset from :00 to avoid landing with the digest and deploy jobs.
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Which endpoint to drip"
        type: choice
        options: [refs, match, authors, discover]
        default: refs
      max_requests:
        description: "Request budget (2400 = ~2h at the public rate; 7200 is the 6h job ceiling)"
        required: false
        default: "2400"
      dry_run:
        description: "Report the outstanding queue and spend nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # state.db is binary: concurrent writers rebase into an unmergeable conflict
  # and one run's work is silently discarded. cancel-in-progress stays false --
  # a cancelled drip loses the requests it already spent.
  group: state-db
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    # A 100-request run at one per 3s is ~5 minutes of sleeping; the cap allows
    # a much larger manual burst without the job being killed mid-write.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python tools/dbsync.py pull

      - name: Harvest
        env:
          # Optional. Raises the ceiling; the drip is sized for life without it.
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.GMAIL_ADDRESS }}
        run: |
          ACTION="${{ github.event.inputs.action }}"
          BUDGET="${{ github.event.inputs.max_requests }}"
          # A scheduled run has no inputs, so alternate by hour: references are
          # the larger prize, so they get two slots of every three.
          if [ -z "$ACTION" ]; then
            if [ "$(( $(date -u +%H) % 3 ))" = "2" ]; then ACTION=match; else ACTION=refs; fi
            BUDGET=2400
          fi
          echo "action=$ACTION budget=$BUDGET"
          python tools/s2_harvest.py "$ACTION" --max-requests "$BUDGET" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # `authors` and `discover` write CANDIDATES to export/ rather than into
      # state.db -- deliberately, since neither a watched author's every paper
      # nor a search hit is a decision. Without this step those files are
      # written on the runner and thrown away with it, which would make both
      # actions look like they had run and produced nothing.
      - name: Keep the candidate files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-candidates
          path: export/
          if-no-files-found: ignore
          retention-days: 30

      - name: Store state.db
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py push
