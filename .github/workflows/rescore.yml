name: Rescore + Sleeve Backfill

# One pass over two gaps: the 3,517 papers stranded unscored (main.py only ranks
# freshly collected items, so anything skipped when a budget expired is never
# revisited), and every paper predating the sleeve fields -- including the
# classics and NBER papers ingested this week.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Papers per run (0 = all outstanding)"
        required: false
        default: "0"
      force:
        description: "Re-score papers that ALREADY have scores (use after an input change)"
        type: boolean
        default: false
      clear_stamps:
        description: "Drop every scored_chars stamp first (only with force; makes the whole archive outstanding again)"
        type: boolean
        default: false

permissions:
  contents: read            # no git writes: state.db lives in R2

concurrency:
  # state.db is binary: concurrent writers rebase into an
  # unmergeable conflict and one run's work is discarded
  group: state-db
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    # 355 of the 360 GitHub allows. The previous full-archive run was killed
    # at 330 within minutes of finishing; work now checkpoints per batch, so
    # this is headroom rather than the thing keeping the run alive.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # state.db lives in R2, not git: it is 53 MB of binary that cannot be
      # merged, so interleaved commits produced unresolvable rebases and one
      # run's work was silently discarded (twice). No-ops if R2 is unset, so
      # the committed copy still works until the bucket exists.
      - name: Fetch state.db
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py pull

      - name: Score the backlog and label sleeves
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python tools/rescore.py --limit ${{ github.event.inputs.limit || 0 }} ${{ github.event.inputs.force == 'true' && '--force' || '' }} ${{ github.event.inputs.clear_stamps == 'true' && '--clear-stamps' || '' }}

      # A8: rescore DELETEs embeddings to invalidate them (rescore.py:140).
      # Nothing else in this workflow re-creates them, so a backfill left 3,001
      # papers (26% of the archive) with no vector and Ask silently searching
      # three-quarters of the corpus. Re-embed before committing.
      - name: Update semantic index
        if: always()
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/embed.py

      # always: a run killed at its timeout must still store what it wrote.
      # dbsync refuses to push anything that fails a health check, because an
      # object store keeps no history to roll back to.
      - name: Store state.db
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/dbsync.py push
