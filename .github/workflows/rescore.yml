name: Rescore + Sleeve Backfill

# One pass over two gaps: the 3,517 papers stranded unscored (main.py only ranks
# freshly collected items, so anything skipped when a budget expired is never
# revisited), and every paper predating the sleeve fields -- including the
# classics and NBER papers ingested this week.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Papers per run (0 = all outstanding)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  # state.db is binary: concurrent writers rebase into an
  # unmergeable conflict and one run's work is discarded
  group: state-db
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    # 355 of the 360 GitHub allows. The previous full-archive run was killed
    # at 330 within minutes of finishing; work now checkpoints per batch, so
    # this is headroom rather than the thing keeping the run alive.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Score the backlog and label sleeves
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python tools/rescore.py --limit ${{ github.event.inputs.limit || 0 }}

      # always: a long run that times out must keep what it scored
      - name: Commit
        if: always()
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.db || true
          git commit -m "rescore + sleeve backfill $(date -u +%F)" || echo "no changes"
          git pull --rebase --autostash origin master || true
          git push || (git pull --rebase --autostash origin master && git push)
